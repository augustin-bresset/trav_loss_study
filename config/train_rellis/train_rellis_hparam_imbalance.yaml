data:
  root:       ~/data/rellis
  voxel_size: 0.1
  max_rad:    50.0
  min_pos:    1

model:
  in_channels: 4
  cr:          0.5   # travnet_cr05 — fixed backbone from model selection study

training:
  epochs:      20
  batch_size:  32
  lr:          0.001
  weight_decay: 0.0001
  num_workers: 4
  device:      cuda

logging:
  log_dir:  data/logs/rellis_hparam_imbalance/
  save_dir: data/checkpoints/rellis_hparam_imbalance/

# ---------------------------------------------------------------------------
# Hyperparameter grid for imbalance-aware losses — PU context
#
# trav_gt is trajectory-based: positives are rare, most "negatives" are
# unlabeled traversable regions.  Consequence for each loss family:
#
#   Focal     — gamma modéré (≤2) pour ne pas sur-focaliser sur les faux
#               négatifs unlabeled. pos_weight élevé pour compenser le
#               déséquilibre fort.
#
#   ASL       — asl_clip élevé (shift des négatifs) pour déprioriser les
#               négatifs incertains (probablement unlabeled traversable).
#               gamma_neg élevé pour down-weighter les négatifs faciles.
#
#   Tversky   — alpha faible (peu pénaliser les FP) car les FP sont souvent
#               des zones traversables non labellisées.
#               beta élevé (pénaliser les FN) = rappel des vrais positifs.
# ---------------------------------------------------------------------------

experiments:

  # ── Baseline ──────────────────────────────────────────────────────────────
  - name: bce
    loss: {name: bce}

  # ── Focal ─────────────────────────────────────────────────────────────────
  - name: focal_g05_pw2
    loss: {name: focal, gamma: 0.5, pos_weight: 2.0}
  - name: focal_g05_pw4
    loss: {name: focal, gamma: 0.5, pos_weight: 4.0}
  - name: focal_g05_pw8
    loss: {name: focal, gamma: 0.5, pos_weight: 8.0}
  - name: focal_g05_pw12
    loss: {name: focal, gamma: 0.5, pos_weight: 12.0}

  - name: focal_g10_pw2
    loss: {name: focal, gamma: 1.0, pos_weight: 2.0}
  - name: focal_g10_pw4
    loss: {name: focal, gamma: 1.0, pos_weight: 4.0}
  - name: focal_g10_pw8
    loss: {name: focal, gamma: 1.0, pos_weight: 8.0}
  - name: focal_g10_pw12
    loss: {name: focal, gamma: 1.0, pos_weight: 12.0}

  - name: focal_g20_pw2
    loss: {name: focal, gamma: 2.0, pos_weight: 2.0}
  - name: focal_g20_pw4
    loss: {name: focal, gamma: 2.0, pos_weight: 4.0}
  - name: focal_g20_pw8
    loss: {name: focal, gamma: 2.0, pos_weight: 8.0}
  - name: focal_g20_pw12
    loss: {name: focal, gamma: 2.0, pos_weight: 12.0}

# ── Focal Extreme value ──────────────────────────────
  - name: focal_g10_pw20
    loss: {name: focal, gamma: 1.0, pos_weight: 20.0}
  - name: focal_g10_pw40
    loss: {name: focal, gamma: 1.0, pos_weight: 40.0}

  - name: focal_g20_pw20
    loss: {name: focal, gamma: 2.0, pos_weight: 20.0}
  - name: focal_g20_pw40
    loss: {name: focal, gamma: 2.0, pos_weight: 40.0}
  - name: focal_g20_pw60
    loss: {name: focal, gamma: 2.0, pos_weight: 60.0} # Pour chercher la rupture

  # ── ASL ───────────────────────────────────────────────────────────────────
  - name: asl_gn2_c05
    loss: {name: asl, gamma_neg: 2.0, asl_clip: 0.05}
  - name: asl_gn2_c10
    loss: {name: asl, gamma_neg: 2.0, asl_clip: 0.10}
  - name: asl_gn2_c20
    loss: {name: asl, gamma_neg: 2.0, asl_clip: 0.20}

  - name: asl_gn4_c05
    loss: {name: asl, gamma_neg: 4.0, asl_clip: 0.05}
  - name: asl_gn4_c10
    loss: {name: asl, gamma_neg: 4.0, asl_clip: 0.10}
  - name: asl_gn4_c20
    loss: {name: asl, gamma_neg: 4.0, asl_clip: 0.20}

  - name: asl_gn6_c05
    loss: {name: asl, gamma_neg: 6.0, asl_clip: 0.05}
  - name: asl_gn6_c10
    loss: {name: asl, gamma_neg: 6.0, asl_clip: 0.10}
  - name: asl_gn6_c20
    loss: {name: asl, gamma_neg: 6.0, asl_clip: 0.20}

  # ── Tversky ───────────────────────────────────────────────────────────────
  - name: tversky_a01
    loss: {name: tversky, tversky_alpha: 0.1, tversky_beta: 0.9}
  - name: tversky_a02
    loss: {name: tversky, tversky_alpha: 0.2, tversky_beta: 0.8}
  - name: tversky_a03
    loss: {name: tversky, tversky_alpha: 0.3, tversky_beta: 0.7}
  - name: tversky_extreme_a005
    loss: {name: tversky, tversky_alpha: 0.05, tversky_beta: 0.95}