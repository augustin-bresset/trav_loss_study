data:
  root:       ~/data/rellis
  voxel_size: 0.1
  max_rad:    50.0
  min_pos:    1

model:
  in_channels: 4

training:
  epochs:      15
  batch_size:  32
  lr:          0.001
  weight_decay: 0.0001
  num_workers: 4
  device:      cuda

logging:
  log_dir:  data/logs/rellis_cv_model/
  save_dir: data/checkpoints/rellis_cv_model/
