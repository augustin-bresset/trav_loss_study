data:
  root:       ~/data/rellis
  voxel_size: 0.1
  max_rad:    50.0
  min_pos:    1

model:
  in_channels: 4
  cr:          0.5   # travnet_cr05 — fixed backbone from model selection study

training:
  epochs:      10
  batch_size:  32
  lr:          0.001
  weight_decay: 0.0001
  num_workers: 4
  device:      cuda

logging:
  log_dir:  data/logs/rellis_focal_gamma/
  save_dir: data/checkpoints/rellis_focal_gamma/

experiments:
  # ── BCE ─────────────────────────────────────────────────────────────────
  - name: focal_g05_pw60
    loss: {name: focal, gamma: 0.5, pos_weight: 60.0}
  - name: focal_g10_pw60
    loss: {name: focal, gamma: 1.0, pos_weight: 60.0}
  - name: focal_g15_pw60
    loss: {name: focal, gamma: 1.5, pos_weight: 60.0}
  - name: focal_g20_pw60
    loss: {name: focal, gamma: 2.0, pos_weight: 60.0}
  - name: focal_g25_pw60
    loss: {name: focal, gamma: 2.5, pos_weight: 60.0}
  - name: focal_g30_pw60
    loss: {name: focal, gamma: 3.0, pos_weight: 60.0}
  - name: focal_g40_pw60
    loss: {name: focal, gamma: 4.0, pos_weight: 60.0}
  - name: focal_g50_pw60
    loss: {name: focal, gamma: 5.0, pos_weight: 60.0}
  - name: focal_g60_pw60
    loss: {name: focal, gamma: 6.0, pos_weight: 60.0}
  - name: focal_g100_pw60
    loss: {name: focal, gamma: 10.0, pos_weight: 60.0}

