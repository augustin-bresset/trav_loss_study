data:
  root:       ~/data/rellis # RELLIS root (parent of Rellis-3D/)
  voxel_size: 0.1
  max_rad:    50.0
  min_pos:    1

model:
  in_channels: 4
  cr:          0.5

training:
  epochs:      15          # fewer than full training — CV cares about rankings, not best abs perf
  batch_size:  16
  lr:          0.001
  weight_decay: 0.0001
  num_workers: 4
  device:      cuda

logging:
  log_dir:  data/logs/rellis_cv/
  save_dir: data/checkpoints/rellis_cv/
