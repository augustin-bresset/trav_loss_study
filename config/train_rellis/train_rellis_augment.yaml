data:
  root:       ~/data/rellis
  voxel_size: 0.1
  min_pos:    1

model:
  in_channels: 4
  cr:          0.5

training:
  epochs:      15
  batch_size:  32
  lr:          0.001
  weight_decay: 0.0001
  num_workers: 4
  device:      cuda

logging:
  log_dir:  data/logs/rellis_augment/
  save_dir: data/checkpoints/rellis_augment/

experiments:

  - name:    bce_aug
    augment: true
    loss:    {name: bce}

  - name:    bce_pw60_aug
    augment: true
    loss:    {name: bce, pos_weight: 60}
