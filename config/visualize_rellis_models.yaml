data:
  root:        ~/data/rellis
  sequence_id: "00000"   # sequence to visualize (one of 00000–00004)
  every:       3         # show every N frames to keep Rerun responsive


inference:
  device:     cuda
  cr:         0.5   # fallback for models without explicit cr (loss-study checkpoints)
  voxel_size: 0.1
  max_rad:    50.0


  
models:
  - name:       "BCE"
    checkpoint: data/checkpoints/rellis_cv/fold0_00000/bce/best.pth


## Augment 

  - name:       "BCE pw 60 Augment" 
    arch:       travnet
    cr:         0.5
    checkpoint: data/checkpoints/rellis_augment/fold0_00000/bce_pw60_aug/best.pth
 

## PU NCE

  - name:       "punce_p10_t05"
    arch:        travnet
    cr:          0.5
    checkpoint:  data/checkpoints/rellis_punce/fold0_00000/punce_p10_t05/best.pth

